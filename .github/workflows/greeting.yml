name: 👋 Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 🎉 Send Greeting
        uses: actions/github-script@v7
        with:
          script: |
            const issueType = context.payload.issue ? 'issue' : 'pull request';
            const number = context.payload.issue?.number || context.payload.pull_request?.number;
            const author = context.payload.issue?.user?.login || context.payload.pull_request?.user?.login;

            const message = [
              `## 🌈 Welcome, @${author}!`,
              ``,
              `Thanks for opening this ${issueType}! You're now part of the **Awesome RGB Toolkit** community.`,
              ``,
              `> 🔥 *Code should not only work great — it should look great too.*`,
              ``,
              `We'll get back to you ASAP. In the meantime, feel free to:`,
              `- ⭐ Star the repo`,
              `- 🍿 Fork it and experiment`,
              `- 📢 Share with your friends`,
              ``,
              `**Welcome to the neon side! 🎨**`
            ].join('\n');

            if (context.payload.issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: message
              });
            } else {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                event: 'COMMENT',
                body: message
              });
            }
